# Local single-node Elasticsearch + Kibana. Security is disabled -- local experiments only.
# Start: docker compose up -d Stop: docker compose down (add -v to wipe data)
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: es
    environment:
    - discovery.type=single-node
    - xpack.security.enabled=false
    - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
    - "9200:9200"
    volumes:
    - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 30

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    container_name: kibana
    environment:
    - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
    - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

volumes:
  esdata: